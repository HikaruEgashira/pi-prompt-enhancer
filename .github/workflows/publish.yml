name: Publish

on:
  push:
    tags: ["v*"]

permissions:
  contents: read
  id-token: write # npm trusted publishing (OIDC)

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11.26.0

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          # Deliberately no `registry-url`: setup-node then writes an .npmrc
          # that authenticates with ${NODE_AUTH_TOKEN}, and npm prefers that
          # token over the OIDC handshake. That is what broke the first release
          # (404 on PUT, no mention of trusted publishing). package.json's
          # publishConfig.registry already points at registry.npmjs.org.

      - run: pnpm install --frozen-lockfile
      - name: Verify release tag
        run: node --input-type=module -e 'import assert from "node:assert/strict"; import pkg from "./package.json" with { type:"json" }; assert.equal(process.env.GITHUB_REF_NAME, "v" + pkg.version)'
      # Trusted publishing reports a configuration mismatch as a plain 404, so
      # prove the OIDC handshake is what publish will actually use.
      - name: Check publish environment
        run: |
          echo "node $(node -v) / npm $(npm -v)"
          test -n "$ACTIONS_ID_TOKEN_REQUEST_URL" \
            && echo "OIDC request URL: present" \
            || echo "OIDC request URL: MISSING"
          echo "NODE_AUTH_TOKEN length: ${#NODE_AUTH_TOKEN}"
          userconfig="${NPM_CONFIG_USERCONFIG:-}"
          if [ -n "$userconfig" ] && [ -f "$userconfig" ]; then
            sed 's/\(_authToken=\).*/\1<redacted>/' "$userconfig"
          else
            echo "npm userconfig: none"
          fi
      - name: Publish
        # npm runs prepublishOnly (typecheck + tests). The repository is public,
        # so npm attaches a provenance attestation automatically.
        run: |
          unset NODE_AUTH_TOKEN
          npm publish
