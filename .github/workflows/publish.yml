name: Publish

on:
  push:
    tags: ["v*"]

permissions:
  contents: read
  id-token: write # npm trusted publishing (OIDC)

jobs:
  publish:
    # npm trusted publishing supports GitHub-hosted runners only.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v5
        with:
          version: 11.26.0

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      - run: pnpm install --frozen-lockfile
      - name: Verify release tag
        run: node --input-type=module -e 'import assert from "node:assert/strict"; import pkg from "./package.json" with { type:"json" }; assert.equal(process.env.GITHUB_REF_NAME, "v" + pkg.version)'
      # Trusted publishing needs npm 11.5.1 or later; fail clearly rather than
      # letting an older CLI fall back to token auth and report a bare 404.
      - name: Check npm supports trusted publishing
        run: node --input-type=module -e 'import { execSync } from "node:child_process"; const [maj, min, pat] = execSync("npm --version").toString().trim().split(".").map(Number); if (maj < 11 || (maj === 11 && (min < 5 || (min === 5 && pat < 1)))) { console.error("::error::npm >= 11.5.1 is required for trusted publishing"); process.exit(1) }'
      - name: Publish
        # npm exchanges the workflow's OIDC token for a short-lived publish
        # credential; no long-lived npm token is used. npm runs prepublishOnly
        # (typecheck + tests). The repository is public, so npm attaches a
        # provenance attestation automatically.
        run: npm publish
