# pnpm 10+ はパッケージ設定をここに置く（package.json の "pnpm" フィールドは読まれない）。
# esbuild / protobufjs / @google/genai は @earendil-works/pi-coding-agent の
# 推移的依存で、型チェックとテストでは実行しない。postinstall を走らせない。
allowBuilds:
  esbuild: false
  protobufjs: false
  '@google/genai': false
minimumReleaseAgeExclude:
  - '@earendil-works/chord@0.86.1'
  - '@earendil-works/pi-agent-core@0.86.1'
  - '@earendil-works/pi-ai@0.86.1'
  - '@earendil-works/pi-coding-agent@0.86.1'
  - '@earendil-works/pi-telemetry@0.86.1'
  - '@earendil-works/pi-tui@0.86.1'
